# 射频线直连回环测试 TX 配置
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  无衰减器直连安全计算（当前默认方案）                                 │
# │                                                                     │
# │  B210 TX 输出估算：tx_gain - 79.75 dBm（100 MHz 附近）              │
# │  线缆插入损耗：约 1 dB（0.5 m SMA 线，100 MHz）                     │
# │  RX 输入 = tx_gain - 80.75 dBm                                      │
# │                                                                     │
# │  AD9361 RX 绝对最大输入：+2.5 dBm（超过将永久损坏）                  │
# │  目标 RX 输入 ≤ −10 dBm（保守安全裕量 12.5 dB）                     │
# │  → tx_gain 上限 = −10 + 80.75 ≈ 70 dB  ← 当前默认值               │
# │                                                                     │
# │  使用 30 dB 衰减器时：tx_gain 可提升至 89 dB（全增益）               │
# └─────────────────────────────────────────────────────────────────────┘
#
# 接线：B210_TX(TX/RX 端口) → [同轴线缆] → B210_RX(RX2 端口)
# 对应 RX 配置：GNSS_RX/configs/rx_cable_loopback.yaml
# 对应计划文档：experiments/plans/2026-03-27/2026-03-27_ber_loopback_tx_plan.md
prn_id: 1
signal_mode: "spread"
# usrp_addr: "serial=193982"       
usrp_addr: "serial=8003272"             # 如需指定设备：serial=<TX_SERIAL>
center_freq: 100000000.0           # 100 MHz 调试频点
# center_freq: 1575420000.0        # GPS L1 真实频点（升级目标，取消注释并同步修改 RX 配置）
samples_per_chip: 4
sample_rate: 4092000.0
tx_gain: 70.0                      # 无衰减器直连上限（RX 输入约 −11 dBm，安全裕量 13.5 dB）
                                   # 有 30 dB 衰减器时可提升至 89.0
amplitude: 1.0
antenna: "TX/RX"
bandwidth: 4092000.0
nav_pattern: "1 0 1 1 0 0 1 0"    # BER 参考序列（1→1，-1→0），与接收端对比时用

# 单音模式参数（signal_mode: "spread" 时不生效，保留作备用）
tone_offset_hz: 500000.0
tone_buffer_s: 0.1

duration_s: null
continuous: true
initial_code_phase: 0
initial_nav_epoch: 0
initial_nav_bit_index: 0
