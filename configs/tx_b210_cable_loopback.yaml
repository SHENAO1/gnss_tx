# 射频线直连回环测试 TX 配置
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  无衰减器直连安全计算（2026-03-27 实测修正版）                        │
# │                                                                     │
# │  实测公式（100 MHz，serial=193982）：                                │
# │    P_tx（总功率）≈ tx_gain − 66 dBm（amplitude=1.0）                │
# │    注：原公式 offset=79.75 在 100 MHz 误差 14 dB，B210 低频增益更高  │
# │                                                                     │
# │  线缆插入损耗：约 1 dB（0.5 m SMA 线，100 MHz）                     │
# │  RX 输入 ≈ tx_gain − 67 dBm                                        │
# │                                                                     │
# │  AD9361 RX 绝对最大输入：+2.5 dBm（超过将永久损坏）                  │
# │  目标 RX 输入 ≤ −10 dBm（保守安全裕量 12.5 dB）                     │
# │  → tx_gain 上限 = −10 + 67 = 57 dB，保守取 50 dB  ← 当前默认值    │
# │                                                                     │
# │  使用固定衰减器时：可在保持 RX 安全的前提下进一步提高 tx_gain       │
# └─────────────────────────────────────────────────────────────────────┘
#
# 接线：B210_TX(TX/RX 端口) → [同轴线缆] → B210_RX(RX2 端口)
# 对应 RX 配置：GNSS_RX/configs/rx_cable_loopback.yaml
# 对应计划文档：experiments/plans/2026-03-28/ber_loopback_tx/2026-03-28_ber_loopback_tx_plan.md
prn_id: 1
signal_mode: "spread"
usrp_addr: "serial=193982"       
# usrp_addr: "serial=8003272"             # 如需指定设备：serial=<TX_SERIAL>
center_freq: 100000000.0           # 100 MHz 调试频点
# center_freq: 1575420000.0        # GPS L1 真实频点（升级目标，取消注释并同步修改 RX 配置）
samples_per_chip: 4
sample_rate: 4092000.0
tx_gain: 50.0                      # 无衰减器直连推荐值（实测 RX 输入约 −17 dBm，安全裕量约 7 dB）
                                   # 硬性上限 57 dB（保守取 50）；若加固定衰减器可另行上调
amplitude: 1.0
antenna: "TX/RX"
bandwidth: 4092000.0
nav_pattern: "1 0 1 1 0 0 1 0"    # BER 参考序列（1→1，-1→0），与接收端对比时用

# 单音模式参数（signal_mode: "spread" 时不生效，保留作备用）
tone_offset_hz: 500000.0
tone_buffer_s: 0.1

duration_s: null
continuous: true
initial_code_phase: 0
initial_nav_epoch: 0
initial_nav_bit_index: 0
