id: gnss_tx_usrp_sink
label: GNSS TX UHD Sink
category: '[GNSS TX]'
flags: [python, throttle]

parameters:
- id: type
  label: Input Type
  dtype: enum
  default: fc32
  options: [fc32, sc16, item32]
  option_labels: [Complex float32, Complex int16, VITA word32]
  hide: part
- id: dev_addr
  label: Device Address
  dtype: string
  default: '"type=b200"'
  hide: part
- id: samp_rate
  label: Samp rate (Sps)
  dtype: real
  default: samp_rate
- id: center_freq0
  label: Center Freq (Hz)
  dtype: raw
  default: '0'
- id: gain0
  label: Gain (dB)
  dtype: raw
  default: '0'
- id: ant0
  label: Antenna
  dtype: string
  default: '"TX/RX"'
  hide: part
- id: bw0
  label: Bandwidth (Hz)
  dtype: raw
  default: '0'

inputs:
- domain: stream
  dtype: complex

templates:
  imports: |-
    import sys
    from pathlib import Path
    from gnuradio import uhd
    _p = Path(__file__).resolve().parent if "__file__" in globals() else Path.cwd()
    _PROJECT_ROOT = next(
        (d for d in [_p] + list(_p.parents) if (d / "src" / "gnss_tx").exists()), _p
    )
    _SRC_PATH = _PROJECT_ROOT / "src"
    if str(_SRC_PATH) not in sys.path:
        sys.path.insert(0, str(_SRC_PATH))
    from gnss_tx.usrp import format_uhd_tx_sample_rate_report
  make: |
    uhd.usrp_sink(
        ",".join(part for part in (${dev_addr},) if part),
        uhd.stream_args(
            cpu_format="${type}",
            channels=[0],
        ),
        "",
    )
    self.${id}.set_samp_rate(float(${samp_rate}))
    self.${id}.set_center_freq(float(${center_freq0}), 0)
    self.${id}.set_gain(float(${gain0}), 0)
    self.${id}.set_antenna(${ant0}, 0)
    self.${id}.set_bandwidth(float(${bw0}), 0)
    print(format_uhd_tx_sample_rate_report(${samp_rate}, self.${id}, label="GNU Radio USRP sink"))
  callbacks:
  - set_samp_rate(${samp_rate})
  - set_center_freq(${center_freq0}, 0)
  - set_gain(${gain0}, 0)
  - set_antenna(${ant0}, 0)
  - set_bandwidth(${bw0}, 0)

documentation: |-
  Minimal UHD USRP sink wrapper for this repository's GNSS TX flowgraphs.

  It mirrors the transmit settings used by the Python runtime path and prints
  the actual UHD sample-rate readback into the GNU Radio console at startup.

file_format: 1
