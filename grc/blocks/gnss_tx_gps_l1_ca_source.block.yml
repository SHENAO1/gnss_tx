id: gnss_tx_gps_l1_ca_source
label: GNSS TX PRN1 Source
category: '[GNSS TX]'
flags: [python]

parameters:
- id: prn_id
  label: PRN ID
  dtype: int
  default: '1'
- id: samples_per_chip
  label: Samples / Chip
  dtype: int
  default: '4'
- id: amplitude
  label: Internal Amplitude
  dtype: real
  default: '1.0'
- id: nav_pattern
  label: Nav Pattern
  dtype: string
  default: '"1 0 1 1 0 0 1 0"'
- id: initial_code_phase
  label: Initial Code Phase
  dtype: int
  default: '0'
- id: initial_nav_epoch
  label: Initial Nav Epoch
  dtype: int
  default: '0'
- id: initial_nav_bit_index
  label: Initial Nav Bit Index
  dtype: int
  default: '0'

outputs:
- domain: stream
  dtype: complex

asserts:
- ${ 1 <= prn_id <= 32 }
- ${ samples_per_chip > 0 }

templates:
  imports: |-
    import sys
    from pathlib import Path
    _p = Path(__file__).resolve().parent if "__file__" in globals() else Path.cwd()
    _PROJECT_ROOT = next(
        (d for d in [_p] + list(_p.parents) if (d / "src" / "gnss_tx").exists()), _p
    )
    _SRC_PATH = _PROJECT_ROOT / "src"
    if str(_SRC_PATH) not in sys.path:
        sys.path.insert(0, str(_SRC_PATH))
    from gnss_tx.gr import make_gps_l1_ca_vector_source
  make: >-
    make_gps_l1_ca_vector_source(
        prn_id=${prn_id},
        samples_per_chip=${samples_per_chip},
        amplitude=${amplitude},
        nav_pattern=${nav_pattern},
        initial_code_phase=${initial_code_phase},
        initial_nav_epoch=${initial_nav_epoch},
        initial_nav_bit_index=${initial_nav_bit_index},
    )

documentation: |-
    GPS L1 C/A buffered replay source. Supports PRN 1~32 (selectable via prn_id).

    Notes:
    - Output is complex64 baseband BPSK spread-spectrum signal
    - Internal navigation data is a cyclic 50 bps test pattern (not real GPS NAV)
    - One full nav-pattern period is precomputed and replayed in a loop via vector_source_c
    - For multi-PRN combined transmission (all 32 PRNs superimposed), use run_tx.py
      with configs/tx_b210_all32prn.yaml instead of this GRC block

file_format: 1
